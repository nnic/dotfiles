os:
  editPreset: "vscode"
promptToReturnFromSubprocess: false # removes "press enter to return to lazygit" popup

git:
  branchPrefix: "user/nmasters/"
  diffRenderers:
    - command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" --side-by-side
      name: Delta Side by Side
    - command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: Delta
    - type: rawGit # git's default diff
      name: default
gui:
  nerdFontsVersion: "3"

